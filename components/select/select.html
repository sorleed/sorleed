<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorleed Select — Reference</title>
  <link rel="stylesheet" href="../../tokens/dist/tokens.css">
  <link rel="stylesheet" href="select.css">
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 480px; }
    .example { margin-block-end: 2rem; }
  </style>
</head>
<body>
  <h1>Select reference</h1>

  <div class="example">
    <h2>Default</h2>
    <div class="sl-select">
      <label class="sl-select__label" for="select-default">Account type</label>
      <div class="sl-select__control">
        <select class="sl-select__field" id="select-default" name="account-type">
          <option value="">Select an account</option>
          <option value="savings">Savings</option>
          <option value="current">Current</option>
          <option value="investment">Investment</option>
        </select>
      </div>
    </div>
  </div>

  <div class="example">
    <h2>With helper text</h2>
    <div class="sl-select">
      <label class="sl-select__label" for="select-helper">Currency</label>
      <div class="sl-select__control">
        <select class="sl-select__field" id="select-helper" name="currency" aria-describedby="select-helper-desc">
          <option value="ngn">NGN — Nigerian Naira</option>
          <option value="usd">USD — US Dollar</option>
          <option value="gbp">GBP — British Pound</option>
        </select>
      </div>
      <p class="sl-select__message" id="select-helper-desc">Select the currency for this transfer.</p>
    </div>
  </div>

  <div class="example">
    <h2>Error</h2>
    <div class="sl-select">
      <label class="sl-select__label" for="select-error">Country</label>
      <div class="sl-select__control">
        <select class="sl-select__field" id="select-error" name="country" aria-invalid="true" aria-describedby="select-error-desc">
          <option value="">Select a country</option>
          <option value="ng">Nigeria</option>
          <option value="gh">Ghana</option>
        </select>
      </div>
      <p class="sl-select__message sl-select__message--error" id="select-error-desc">Country is required.</p>
    </div>
  </div>

  <div class="example">
    <h2>Disabled</h2>
    <div class="sl-select">
      <label class="sl-select__label" for="select-disabled">Branch</label>
      <div class="sl-select__control">
        <select class="sl-select__field" id="select-disabled" name="branch" disabled>
          <option value="lagos">Lagos</option>
          <option value="abuja">Abuja</option>
        </select>
      </div>
    </div>
  </div>
</body>
</html>
