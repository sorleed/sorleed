name: CI

on:
  push:
    branches:
      - main
      - docs/foundation-baseline
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Tokens, contracts and components
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate tokens
        run: node tokens/check.mjs

      - name: Validate contracts
        run: node components/validate-contracts.mjs

      - name: Validate CLI template parity
        run: node components/validate-parity.mjs

      - name: Run component tests
        run: node --test components/test/*.test.mjs

  cli:
    name: CLI tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run CLI tests
        run: npm test
        working-directory: cli

  react:
    name: React tests, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: react

      - name: Run React tests
        run: npm test
        working-directory: react

      - name: Typecheck
        run: npm run typecheck
        working-directory: react

      - name: Build
        run: npm run build
        working-directory: react

  docs:
    name: Documentation and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install tooling
        run: npm ci

      - name: Validate Markdown, HTML, JSON, YAML and CODEOWNERS
        run: node scripts/validate-docs.mjs

  consumer:
    name: Packed package consumer test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tooling
        run: npm ci

      - name: Pack, install and exercise the packages
        run: node scripts/consumer-test.mjs

  browser:
    name: Browser and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install tooling
        run: npm ci

      - name: Run Chromium and axe checks
        run: node scripts/browser-check.mjs
