name: CI

on:
  push:
    branches:
      - main
      - docs/foundation-baseline
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Tokens, contracts and components
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate tokens
        run: node tokens/check.mjs

      - name: Validate contracts
        run: node components/validate-contracts.mjs

      - name: Validate CLI template parity
        run: node components/validate-parity.mjs

      - name: Run component tests
        run: node --test components/test/*.test.mjs

  cli:
    name: CLI tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run CLI tests
        run: npm test
        working-directory: cli

  react:
    name: React tests, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: react

      - name: Run React tests
        run: npm test
        working-directory: react

      - name: Typecheck
        run: npm run typecheck
        working-directory: react

      - name: Build
        run: npm run build
        working-directory: react
