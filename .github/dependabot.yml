version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/react"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/cli"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # Major action upgrades change the runner runtime and behaviour. Review
      # them deliberately instead of accepting Dependabot major bumps.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
